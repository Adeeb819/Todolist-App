{% extends 'base.html' %}

{% block head %}
{% endblock %}


{% block body %}
<div class="content content-narrow">
    <header class="hero">
        <div class="hero-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 20h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <h1>Edit Task</h1>
        <p class="hero-sub">Update the details below</p>
    </header>

    <form action="/update/{{ task.id }}" method="POST" class="update-form">
        <input type="text" name="content" id="content" value="{{ task.content }}" autocomplete="off" required>
        <div class="update-actions">
            <a href="/" class="btn btn-ghost">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
    </form>
</div>
{% endblock %}
